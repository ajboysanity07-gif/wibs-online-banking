; Production OPcache tuning for a 2 vCPU / 4GB VPS.
; validate_timestamps=0 means PHP will NOT notice source changes until the
; container restarts (docker/entrypoint.sh runs `optimize:clear`/`optimize`
; on every start, which pairs with a full container redeploy). An in-place
; code sync without a container restart will serve stale opcode cache.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=1255
opcache.jit_buffer_size=64M
