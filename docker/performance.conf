# Compress text responses (HTML/JSON/JS/CSS/SVG/fonts).
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
    AddOutputFilterByType DEFLATE application/javascript application/json image/svg+xml
    AddOutputFilterByType DEFLATE font/ttf font/otf application/vnd.ms-fontobject
</IfModule>

# Vite filenames are content-hashed, so built assets never change in place.
<IfModule mod_headers.c>
    <LocationMatch "^/build/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</IfModule>
