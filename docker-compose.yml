services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wibs-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "80"
    volumes:
      - laravel_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      - redis
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wibs.rule=Host(`www.mrdinc.net`)"
      - "traefik.http.routers.wibs.entrypoints=websecure"
      - "traefik.http.routers.wibs.tls.certresolver=letsencrypt"
      - "traefik.http.services.wibs.loadbalancer.server.port=80"
      - "traefik.http.routers.wibs-apex.rule=Host(`mrdinc.net`)"
      - "traefik.http.routers.wibs-apex.entrypoints=websecure"
      - "traefik.http.routers.wibs-apex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wibs-apex.middlewares=wibs-apex-redirect"
      - "traefik.http.middlewares.wibs-apex-redirect.redirectregex.regex=^https://mrdinc.net/(.*)"
      - "traefik.http.middlewares.wibs-apex-redirect.redirectregex.replacement=https://www.mrdinc.net/$${1}"
      - "traefik.http.middlewares.wibs-apex-redirect.redirectregex.permanent=true"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wibs-queue
    restart: unless-stopped
    env_file:
      - .env
    command: >-
      php artisan queue:work
      --queue=loan-workflow,loan-workflow-notifications,default
      --tries=5
      --timeout=120
      --backoff=60,300,900
      --sleep=3
      --max-time=3600
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      - app
      - redis
    networks:
      - web

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wibs-scheduler
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - laravel_storage:/var/www/html/storage
    depends_on:
      - app
      - redis
    networks:
      - web

  redis:
    image: redis:7-alpine
    container_name: wibs-redis
    restart: unless-stopped
    # Not published to the host: only the app/queue/scheduler containers on
    # the "web" network need it, reached at hostname "redis" (see .env's
    # REDIS_HOST). No password by default since it's unreachable from
    # outside this Docker network; set REDIS_PASSWORD + --requirepass here
    # if that assumption ever changes.
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - web

volumes:
  laravel_storage:
  redis_data:

networks:
  web:
    external: true
